type Query {
  userDetails(username: String): User
  placeDetails(id: ID!): PlaceDetails
}

type User {
  username: String
  email: String
  memberSince: String
}

type Place {
  id: ID!
  name: String!
  address: String!
  lat: Float!
  lng: Float!
  createdAt: String!
  creatorUserId: ID!
}

type PlaceDetails {
  place: Place!
  userRating: Float!
  creatorUsername: String!
  averageRating: Float!
}
